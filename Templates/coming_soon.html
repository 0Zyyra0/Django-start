<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>به‌زودی در دسترس خواهد بود</title>
	<meta name="robots" content="noindex, nofollow">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html, body {
			height: 100%;
		}

		body {
			font-family: Tahoma, "Segoe UI", Arial, sans-serif;
			background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
			color: #ffffff;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 20px;
		}

		.wrapper {
			max-width: 600px;
		}

		.icon {
			font-size: 60px;
			margin-bottom: 20px;
		}

		h1 {
			font-size: 32px;
			margin-bottom: 15px;
		}

		p {
			font-size: 16px;
			line-height: 1.8;
			color: #e6e6e6;
		}

		.dots span {
			display: inline-block;
			width: 10px;
			height: 10px;
			margin: 0 4px;
			border-radius: 50%;
			background: #ffffff;
			opacity: 0.3;
			animation: blink 1.4s infinite both;
		}

		.dots span:nth-child(2) { animation-delay: 0.2s; }
		.dots span:nth-child(3) { animation-delay: 0.4s; }

		@keyframes blink {
			0%, 80%, 100% { opacity: 0.3; }
			40% { opacity: 1; }
		}
	</style>
</head>
<body>
	<div class="wrapper">
		<div class="icon">🚧</div>
		<h1>به‌زودی در دسترس خواهد بود</h1>
		<p>
			در حال حاضر مشغول آماده‌سازی سایت هستیم. لطفاً کمی صبر کنید و بعداً دوباره سر بزنید.
		</p>
		<br>
		<div class="dots">
			<span></span>
			<span></span>
			<span></span>
		</div>
	</div>
</body>
</html>
