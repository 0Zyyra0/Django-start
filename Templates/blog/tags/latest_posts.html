{% load static %}
{% for post in posts %}
<div class="single-recent-blog-post item">
	<div class="thumb">
		<img class="img-fluid" src="{% if post.image %}{{ post.image.url }}{% else %}{% static 'img/b1.jpg' %}{% endif %}" alt="{{ post.title }}">
	</div>
	<div class="details">
		{% if post.category %}
		<div class="tags">
			<ul>
				<li><a href="{% url 'blog:category' post.category.slug %}">{{ post.category.title }}</a></li>
			</ul>
		</div>
		{% endif %}
		<a href="{% url 'blog:single' post.pk %}"><h4 class="title">{{ post.title }}</h4></a>
		<p>
			{{ post.excerpt }}
		</p>
		<h6 class="date">{{ post.published_date|date:"jS F, Y" }}</h6>
	</div>	
</div>
{% empty %}
<p class="text-center">در حال حاضر هیچ پست منتشرشده‌ای وجود ندارد.</p>
{% endfor %}
