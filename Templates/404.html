<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow">
	<title>صفحه مورد نظر پیدا نشد (404)</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			font-family: Tahoma, "Segoe UI", Arial, sans-serif;
			background: #0f2027;
			background: linear-gradient(135deg, #2c5364 0%, #203a43 50%, #0f2027 100%);
			color: #ffffff;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 20px;
		}
		.wrapper { max-width: 600px; }
		.code { font-size: 90px; font-weight: bold; opacity: 0.85; margin-bottom: 10px; }
		h1 { font-size: 26px; margin-bottom: 15px; }
		p { font-size: 16px; line-height: 1.8; color: #dcdcdc; margin-bottom: 25px; }
		a {
			display: inline-block;
			padding: 10px 25px;
			background: #ffffff;
			color: #203a43;
			text-decoration: none;
			border-radius: 30px;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<div class="wrapper">
		<div class="code">404</div>
		<h1>این صفحه پیدا نشد</h1>
		<p>آدرسی که وارد کرده‌اید وجود ندارد یا جابه‌جا شده است.</p>
		<a href="/">بازگشت به صفحه‌ی اصلی</a>
	</div>
</body>
</html>
